# Secret-scan gate for a PUBLIC repo (ADR-0042). Pure-node, zero install — the
# quality bar mandates a secret scan before push; this enforces it on every push
# and PR. Fails the build if a probable credential lands in a tracked file.
name: secret-scan

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan tracked files for credentials
        run: node scripts/scan-secrets.mjs
